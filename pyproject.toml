[project]
name = "webscrep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [

]


[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "S",
    "N",
    "D",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores] 
"tests/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true


[tool.mypy]
python_version = "3.14"
strict = true

# Qualidade das mensagens
pretty = true
show_error_codes = true
show_column_numbers = true

# Avisos úteis
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Evita seguir imports sem tipos
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
    "test_*.py",
    "*_test.py",
]

addopts = [
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]


