repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pydocstring-type-checker
        name: Pydocstring Type Checker
        entry: uv run python scripts/check_docstring_types.py
        language: system
        types: [python]

      - id: mypy
        name: MyPy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]